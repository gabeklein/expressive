name: PR

on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
      any: ${{ steps.affected.outputs.any }}
      e2e: ${{ steps.affected.outputs.e2e }}
      hot: ${{ steps.affected.outputs.hot }}
      dev: ${{ steps.affected.outputs.dev }}
      rpc: ${{ steps.affected.outputs.rpc }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Affected packages
        id: affected
        env:
          BASE: ${{ github.base_ref }}
        run: bun .github/scripts/affected.ts "origin/$BASE"

  verify:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Typecheck
        id: typecheck
        if: needs.changes.outputs.any != 'false'
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: bun run ${PACKAGES:---filter=./packages/*} typecheck

      - name: Tests
        if: needs.changes.outputs.any != 'false' && (success() || steps.typecheck.outcome == 'failure')
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: bun run ${PACKAGES:---filter=./packages/*} coverage

      - run: bun run build

      - name: Dist is consumable
        run: bun .github/scripts/dist-check.ts

      - name: Docs agree with code
        run: bun .github/scripts/docs-check.ts

      - name: JSDoc examples typecheck
        run: bun .github/scripts/example-check.ts

      - name: Changeset reminder
        if: github.base_ref == 'main' || github.event.pull_request.stack != null
        continue-on-error: true
        env:
          BASE: ${{ github.base_ref }}
        run: bunx changeset status --since "origin/$BASE"

  size:
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.any != 'false' &&
      (github.base_ref == 'main' || github.event.pull_request.stack != null)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup

      - name: Build base
        run: |
          git worktree add "$RUNNER_TEMP/base" HEAD^1
          cd "$RUNNER_TEMP/base"
          bun install --frozen-lockfile
          bun run build
          bun "$GITHUB_WORKSPACE/.github/scripts/bundle-size.ts" --partial --out "$RUNNER_TEMP/base.json"

      - run: bun run build

      - name: Bundle size
        run: bun .github/scripts/bundle-size.ts --base "$RUNNER_TEMP/base.json" --gate

  dist-smoke:
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.any != 'false' && (
        github.event.pull_request.stack == null && github.base_ref == 'main' ||
        github.event.pull_request.stack != null &&
        github.event.pull_request.stack.position == github.event.pull_request.stack.size
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: dist-smoke-npm-${{ runner.os }}-${{ hashFiles('package.json', 'packages/*/package.json') }}
          restore-keys: dist-smoke-npm-${{ runner.os }}-

      - run: bun run build

      - name: Packed tarballs install and run
        run: bun .github/scripts/dist-smoke.ts

  e2e:
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.e2e != 'false' && (
        github.event.pull_request.stack == null && github.base_ref == 'main' ||
        github.event.pull_request.stack != null &&
        github.event.pull_request.stack.position == github.event.pull_request.stack.size
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Specs on React and dom
        env:
          CHROME: /usr/bin/google-chrome
        working-directory: examples
        run: bun run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: examples/test-results
          retention-days: 7

  dev:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.dev != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build
        run: bun run build

      - name: Example specs on the dev and built servers
        env:
          CHROME: /usr/bin/google-chrome
        working-directory: packages/dev
        run: bun run example:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dev-playwright-report
          path: packages/dev/example/test-results
          retention-days: 7

  rpc:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rpc != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build
        run: bun run build

      - name: Example specs on vite dev, Node and wrangler dev
        env:
          CHROME: /usr/bin/google-chrome
        working-directory: packages/rpc
        run: bun run example:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rpc-playwright-report
          path: packages/rpc/example/test-results
          retention-days: 7

  hot:
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.hot != 'false' && (
        github.event.pull_request.stack == null && github.base_ref == 'main' ||
        github.event.pull_request.stack != null &&
        github.event.pull_request.stack.position == github.event.pull_request.stack.size
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Hot reload in Chrome
        env:
          CHROME: /usr/bin/google-chrome
        run: bun .github/scripts/hot-probe.ts

      - name: Number table matches Chrome
        continue-on-error: true
        env:
          CHROME: /usr/bin/google-chrome
        run: bun .github/scripts/numeric-properties.ts --check

  native:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'react-native') && (
        github.event.pull_request.stack == null && github.base_ref == 'main' ||
        github.event.pull_request.stack != null &&
        github.event.pull_request.stack.position == github.event.pull_request.stack.size
      )
    uses: ./.github/workflows/native.yml
